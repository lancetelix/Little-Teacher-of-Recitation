<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌱 今天的小老師</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #FAF8F5; /* 規範指定的米白色背景 */
      color: #2D3748;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #FFFFFF;
      padding: 40px 28px 36px;
      border-radius: 28px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.03);
      text-align: center;
      max-width: 400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .header img, .header svg { width: 32px; height: 32px; }
    h1 {
      color: #2E7D32; /* 規範規定的主視覺綠色 */
      font-size: 1.8rem;
      font-weight: 700;
    }
    .subtitle {
      color: #718096;
      font-size: 1rem;
      margin-bottom: 36px;
    }
    .start-btn {
      background-color: #4CAF50; /* 規範指定的綠色按鈕 */
      color: white;
      border: none;
      padding: 14px 44px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(76, 175, 80, 0.25);
      transition: transform 0.1s, background-color 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .start-btn:active { transform: scale(0.97); }
    /* 關鍵：明確給學生的提示詞區塊 */
    .prompt-text {
      margin-top: 48px;
      color: #718096;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }
    .result-box {
      margin-top: 24px;
      padding: 16px;
      background: #F0F7F4;
      border-radius: 16px;
      width: 100%;
      text-align: left;
      font-size: 0.95rem;
      line-height: 1.7;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <!-- 幼芽 SVG -->
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 38C32 24 18 16 18 16C18 16 18 29 32 38Z" fill="#7CB342" stroke="#1E3A52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M32 38C32 20 48 16 48 16C48 16 44 31 32 38Z" fill="#8BC34A" stroke="#1E3A52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M32 38V48" stroke="#1E3A52" stroke-width="3" stroke-linecap="round"/>
        <circle cx="32" cy="46" r="6" fill="#E07A5F" stroke="#1E3A52" stroke-width="3"/>
      </svg>
      <h1>今天的小老師</h1>
    </div>
    <p class="subtitle">陪你完成今天的練習。</p>

    <button id="startBtn" class="start-btn">
      🎤 開始說話
    </button>

    <!-- 語音辨識結果調試框 -->
    <div id="resultBox" class="result-box" style="display: none;">
      <div><strong>說出的話：</strong><span id="transcriptText">-</span></div>
      <hr style="border: none; border-top: 1px stroke #CBD5E0; margin: 8px 0;">
      <div>年級：<span id="gradeVal">-</span></div>
      <div>班級代碼：<span id="classCodeVal">-</span></div>
      <div>座號：<span id="seatVal">-</span></div>
      <div>內部識別 ID：<strong id="studentIdVal" style="color: #2E7D32;">-</strong></div>
    </div>

    <!-- 給學生的引導文字（必要項目） -->
    <p class="prompt-text">請說：「我是三年〇班〇號，我要開始了。」</p>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const resultBox = document.getElementById('resultBox');
    const transcriptText = document.getElementById('transcriptText');
    const gradeVal = document.getElementById('gradeVal');
    const classCodeVal = document.getElementById('classCodeVal');
    const seatVal = document.getElementById('seatVal');
    const studentIdVal = document.getElementById('studentIdVal');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert('請使用 Google Chrome 或 Microsoft Edge 瀏覽器開啟。');
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'zh-TW';
      recognition.continuous = false;

      startBtn.addEventListener('click', () => {
        startBtn.innerText = '🎙️ 正在聽你說...';
        try {
          recognition.start();
        } catch (e) {
          alert('無法啟動麥克風：' + e.message);
          startBtn.innerText = '🎤 開始說話';
        }
      });

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        transcriptText.textContent = text;
        resultBox.style.display = 'block';
        parseStudentInfo(text);
      };

      recognition.onend = () => { startBtn.innerText = '🎤 開始說話'; };
      recognition.onerror = (event) => {
        startBtn.innerText = '🎤 開始說話';
        if (event.error === 'not-allowed') {
          alert('請允許麥克風權限才能開始背誦喔！');
        } else {
          alert('語音辨識發生錯誤：' + event.error);
        }
      };
    }

    function parseStudentInfo(text) {
      const regex = /([1-9一二三四五六七八九1-9])\s*年\s*([0-9０-９一二三四五六七八九十]+)\s*班\s*(?:第)?\s*([0-9０-９一二三四五六七八九十]+)\s*號/;
      const match = text.match(regex);

      if (match) {
        const grade = convertNum(match[1]);
        const classNum = convertNum(match[2]);
        const seatNum = convertNum(match[3]);

        const classCode = `${grade}${classNum.padStart(2, '0')}`;
        const studentId = `${classCode}-${seatNum.padStart(2, '0')}`;

        gradeVal.textContent = grade;
        classCodeVal.textContent = classCode;
        seatVal.textContent = seatNum;
        studentIdVal.textContent = studentId;
      } else {
        gradeVal.textContent = '未辨識';
        classCodeVal.textContent = '未辨識';
        seatVal.textContent = '未辨識';
        studentIdVal.textContent = '格式不符，請參考下方提示詞再試一次';
      }
    }

    function convertNum(str) {
      const zhMap = {'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
      let num = str.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xfee0));
      if (zhMap[num]) return String(zhMap[num]);
      return String(parseInt(num, 10) || num);
    }
  </script>
</body>
</html>
