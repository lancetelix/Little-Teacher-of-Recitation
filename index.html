<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌱 今天的小老師</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #FAF8F5;
      color: #2D3748;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #FFFFFF;
      padding: 40px 28px 36px;
      border-radius: 28px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.03);
      text-align: center;
      max-width: 400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .header svg { width: 32px; height: 32px; }
    h1 {
      color: #2E7D32;
      font-size: 1.8rem;
      font-weight: 700;
    }
    .subtitle {
      color: #718096;
      font-size: 1rem;
      margin-bottom: 28px;
    }
    .start-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 14px 44px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(76, 175, 80, 0.25);
      transition: transform 0.1s, background-color 0.2s;
    }
    .start-btn:active { transform: scale(0.97); }

    .status-msg {
      margin-top: 20px;
      font-size: 1.05rem;
      color: #2E7D32;
      font-weight: 600;
      min-height: 1.5em;
    }

    .task-area {
      margin-top: 20px;
      width: 100%;
    }

    .task-card {
      background: #F4EFEA;
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 12px;
      text-align: left;
    }

    .task-badge {
      background: #4CAF50;
      color: white;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 6px;
    }

    .task-title {
      color: #1E3A52;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .prompt-text {
      margin-top: 36px;
      color: #718096;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 38C32 24 18 16 18 16C18 16 18 29 32 38Z" fill="#7CB342" stroke="#1E3A52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M32 38C32 20 48 16 48 16C48 16 44 31 32 38Z" fill="#8BC34A" stroke="#1E3A52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M32 38V48" stroke="#1E3A52" stroke-width="3" stroke-linecap="round"/>
        <circle cx="32" cy="46" r="6" fill="#E07A5F" stroke="#1E3A52" stroke-width="3"/>
      </svg>
      <h1>今天的小老師</h1>
    </div>
    <p class="subtitle">陪你完成今天的練習。</p>

    <button id="startBtn" class="start-btn">🎤 開始說話</button>

    <div id="statusMsg" class="status-msg"></div>
    <div id="taskArea" class="task-area"></div>

    <p class="prompt-text">請說：「我是三年〇班〇號，我要開始了。」</p>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzRi86w6Bt_MZO-utAPDPR7ujBojxobdR9YG7XGg4C_Vdu1Xlk6MV-nuIrg1CraukIJAw/exec";

    const startBtn = document.getElementById('startBtn');
    const statusMsg = document.getElementById('statusMsg');
    const taskArea = document.getElementById('taskArea');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert('請使用 Google Chrome 或 Microsoft Edge 瀏覽器開啟。');
    } else {
      const recognition = new SpeechRecognition();
      recognition.lang = 'zh-TW';
      recognition.continuous = false;

      startBtn.addEventListener('click', () => {
        startBtn.innerText = '🎙️ 正在聽你說...';
        statusMsg.textContent = '';
        taskArea.innerHTML = '';
        try {
          recognition.start();
        } catch (e) {
          startBtn.innerText = '🎤 開始說話';
        }
      });

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        parseStudentInfo(text);
      };

      recognition.onend = () => { startBtn.innerText = '🎤 開始說話'; };
      recognition.onerror = (event) => {
        startBtn.innerText = '🎤 開始說話';
        if (event.error === 'not-allowed') {
          statusMsg.style.color = '#E07A5F';
          statusMsg.textContent = '請允許麥克風權限才能開始練習喔！';
        }
      };
    }

    function parseStudentInfo(text) {
      const regex = /([1-9一二三四五六七八九1-9])\s*年\s*([0-9０-９一二三四五六七八九十]+)\s*班\s*(?:第)?\s*([0-9０-９一二三四五六七八九十]+)\s*號/;
      const match = text.match(regex);

      if (match) {
        const grade = convertNum(match[1]);
        const classNum = convertNum(match[2]);
        const seatNum = convertNum(match[3]);

        const classCode = `${grade}${classNum.padStart(2, '0')}`;
        const paddedSeat = seatNum.padStart(2, '0');

        statusMsg.style.color = '#2E7D32';
        statusMsg.textContent = `你好，${grade}年${classNum}班${seatNum}號！`;

        fetchPendingTasks(classCode, paddedSeat);

      } else {
        statusMsg.style.color = '#E07A5F';
        statusMsg.textContent = '沒聽清楚，再試一次喔！請參考下方提示。';
      }
    }

    function convertNum(str) {
      const zhMap = {'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
      let num = str.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xfee0));
      if (zhMap[num]) return String(zhMap[num]);
      return String(parseInt(num, 10) || num);
    }

    function fetchPendingTasks(classCode, seatNo) {
      taskArea.innerHTML = '<p style="color: #718096;">正在尋找你的今日練習...</p>';

      fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'getPendingTasks',
          classCode: classCode,
          seatNo: seatNo
        })
      })
      .then(response => response.json())
      .then(res => {
        if (res.status === 'success') {
          renderTasks(res.data);
        } else {
          taskArea.innerHTML = `<p style="color: #E07A5F;">讀取失敗：${res.message}</p>`;
        }
      })
      .catch(err => {
        console.error(err);
        taskArea.innerHTML = '<p style="color: #E07A5F;">連線發生錯誤，請檢查網路設定。</p>';
      });
    }

    function renderTasks(tasks) {
      if (tasks.length === 0) {
        taskArea.innerHTML = `
          <div style="background: #E8F5E9; padding: 16px; border-radius: 16px; color: #2E7D32; font-weight: bold;">
            🎉 太棒了！你已經完成所有背誦任務囉！
          </div>`;
        return;
      }

      let html = `<p style="color: #2D3748; font-weight: bold; margin-bottom: 12px; text-align: left;">你今天有 ${tasks.length} 個任務：</p>`;

      tasks.forEach(task => {
        html += `
          <div class="task-card">
            <span class="task-badge">${task.type || '練習'}</span>
            <div class="task-title">${task.title}</div>
          </div>`;
      });

      taskArea.innerHTML = html;
    }
  </script>
</body>
</html>
