<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌱 今天的小老師</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #FAF8F5;
      color: #2D3748;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #FFFFFF;
      padding: 36px 28px;
      border-radius: 28px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.03);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .header svg { width: 32px; height: 32px; }
    h1 { color: #2E7D32; font-size: 1.75rem; font-weight: 700; }
    .subtitle { color: #718096; font-size: 0.95rem; margin-bottom: 24px; }
    
    .start-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 12px 36px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(76, 175, 80, 0.25);
      transition: transform 0.1s;
    }
    .start-btn:active { transform: scale(0.97); }

    .status-msg { margin-top: 16px; font-size: 1rem; color: #2E7D32; font-weight: 600; line-height: 1.5; }
    .task-area { margin-top: 20px; width: 100%; }

    .task-card {
      background: #F4EFEA;
      padding: 16px;
      border-radius: 18px;
      margin-bottom: 12px;
      text-align: left;
    }
    .task-badge {
      background: #4CAF50; color: white;
      padding: 2px 8px; border-radius: 10px;
      font-size: 0.75rem; font-weight: bold;
      display: inline-block; margin-bottom: 6px;
    }
    .task-title { color: #1E3A52; font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; }
    
    .recite-btn {
      background-color: #E07A5F;
      color: white; border: none;
      padding: 10px 18px; font-size: 0.95rem;
      border-radius: 20px; cursor: pointer;
      font-weight: bold; width: 100%;
      transition: background-color 0.2s;
    }

    .ai-feedback {
      margin-top: 10px; padding: 10px;
      background: #FFFFFF; border-radius: 12px;
      font-size: 0.9rem; line-height: 1.5;
    }

    .prompt-text { margin-top: 32px; color: #718096; font-size: 0.95rem; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <svg viewBox="0 0 64 64" fill="none">
        <path d="M32 38C32 24 18 16 18 16C18 16 18 29 32 38Z" fill="#7CB342" stroke="#1E3A52" stroke-width="3"/>
        <path d="M32 38C32 20 48 16 48 16C48 16 44 31 32 38Z" fill="#8BC34A" stroke="#1E3A52" stroke-width="3"/>
        <path d="M32 38V48" stroke="#1E3A52" stroke-width="3"/>
        <circle cx="32" cy="46" r="6" fill="#E07A5F" stroke="#1E3A52" stroke-width="3"/>
      </svg>
      <h1>今天的小老師</h1>
    </div>
    <p class="subtitle">陪你完成今天的練習。</p>

    <button id="startBtn" class="start-btn">🎤 開始登入</button>

    <div id="statusMsg" class="status-msg"></div>
    <div id="taskArea" class="task-area"></div>

    <p class="prompt-text">請說：「我是三年〇班〇號，我要開始了。」</p>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzRi86w6Bt_MZO-utAPDPR7ujBojxobdR9YG7XGg4C_Vdu1Xlk6MV-nuIrg1CraukIJAw/exec";

    let currentClassCode = "";
    let currentSeatNo = "";

    let activeRec = null;
    let silenceTimer = null;
    let accumulatedText = "";

    // 判斷是否為 iOS 設備 (iPhone, iPad)
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    const startBtn = document.getElementById('startBtn');
    const statusMsg = document.getElementById('statusMsg');
    const taskArea = document.getElementById('taskArea');

    // ========== 登入語音辨識 ==========
    startBtn.addEventListener('click', () => {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('您的瀏覽器不支援語音辨識，請使用 Chrome 瀏覽器。');
        return;
      }

      startBtn.innerText = '🎙️ 正在聽你說...';
      statusMsg.innerHTML = '';
      taskArea.innerHTML = '';
      
      // 必須在點擊事件內建立實體，iOS 才不會阻擋
      const loginRec = new SpeechRecognition();
      loginRec.lang = 'zh-TW';
      loginRec.continuous = false; // iOS 登入時強制 false
      loginRec.interimResults = false;

      loginRec.onresult = (event) => {
        const text = event.results[0][0].transcript;
        parseStudentInfo(text);
      };

      loginRec.onerror = (event) => {
        if (event.error !== 'no-speech') {
          statusMsg.style.color = '#E07A5F';
          statusMsg.textContent = '麥克風讀取失敗 (' + event.error + ')，請確認權限後再試一次。';
        }
      };

      loginRec.onend = () => { startBtn.innerText = '🎤 開始登入'; };

      try {
        loginRec.start();
      } catch(e) {
        startBtn.innerText = '🎤 開始登入';
      }
    });

    // ========== 解析班級與座號 ==========
    function parseStudentInfo(text) {
      let t = text.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xfee0));
      const numMap = {'一':'1','二':'2','兩':'2','三':'3','四':'4','五':'5','六':'6','七':'7','八':'8','九':'9','十':'10','零':'0','〇':'0','O':'0'};
      t = t.replace(/十([一二三四五六七八九])/g, (m, p1) => "1" + numMap[p1]);
      t = t.replace(/([二三四五六七八九])十([一二三四五六七八九])?/g, (m, p1, p2) => numMap[p1] + (p2 ? numMap[p2] : "0"));
      t = t.replace(/十/g, "10"); 
      t = t.replace(/[一二兩三四五六七八九零〇O]/g, m => numMap[m]);

      let grade, classNum, seatNum;

      const regexA = /([1-9]).*?[年連黏級].*?([0-9]+).*?班.*?([0-9]+).*?號/;
      const regexB = /([1-9])([0-9]{1,2}).*?班.*?([0-9]+).*?號/;

      let matchA = t.match(regexA);
      let matchB = t.match(regexB);

      if (matchA) {
        grade = matchA[1];
        classNum = parseInt(matchA[2], 10);
        seatNum = parseInt(matchA[3], 10);
      } else if (matchB) {
        grade = matchB[1];
        classNum = parseInt(matchB[2], 10);
        seatNum = parseInt(matchB[3], 10);
      }

      if (grade && classNum && seatNum) {
        currentClassCode = `${grade}${String(classNum).padStart(2, '0')}`;
        currentSeatNo = String(seatNum).padStart(2, '0');

        statusMsg.style.color = '#2E7D32';
        statusMsg.textContent = `你好，${grade}年${classNum}班${seatNum}號！`;

        fetchPendingTasks(currentClassCode, currentSeatNo);
      } else {
        statusMsg.style.color = '#E07A5F';
        statusMsg.innerHTML = `沒聽清楚班級或座號喔！<br><span style="font-size:0.85rem;color:#718096;">(剛才小老師聽到的是：「${text}」)</span>`;
      }
    }

    // ========== 撈取未完成任務 ==========
    function fetchPendingTasks(classCode, seatNo) {
      taskArea.innerHTML = '<p style="color: #718096;">尋找今日練習中...</p>';
      fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'getPendingTasks', classCode, seatNo })
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === 'success') {
          renderTasks(res.data);
        } else {
          taskArea.innerHTML = `<p style="color:#E07A5F;">讀取失敗：${res.message}</p>`;
        }
      })
      .catch(err => {
        taskArea.innerHTML = `<p style="color:#E07A5F;">連線失敗，請檢查網路。</p>`;
      });
    }

    function renderTasks(tasks) {
      if (!tasks || tasks.length === 0) {
        taskArea.innerHTML = `<div style="background:#E8F5E9;padding:16px;border-radius:16px;color:#2E7D32;font-weight:bold;">🎉 今天練習都完成了，太棒囉！</div>`;
        return;
      }

      let html = `<p style="color:#2D3748;font-weight:bold;margin-bottom:10px;text-align:left;">請選擇任務開始練習：</p>`;
      tasks.forEach(task => {
        html += `
          <div class="task-card" id="card-${task.taskId}">
            <span class="task-badge">${task.type || '背誦'}</span>
            <div class="task-title">${task.title}</div>
            <button class="recite-btn" data-status="idle" onclick="handleReciteClick('${task.taskId}')">🎙️ 按我開始背誦</button>
            <div class="ai-feedback" id="feedback-${task.taskId}" style="display:none;"></div>
          </div>`;
      });
      taskArea.innerHTML = html;
    }

    function handleReciteClick(taskId) {
      const btn = document.querySelector(`#card-${taskId} .recite-btn`);
      if (btn.dataset.status === 'recording') {
        finishAndSubmitRecitation(taskId);
      } else if (btn.dataset.status === 'idle') {
        startReciting(taskId);
      }
    }

    // ========== 開始背誦 (加入 iOS 相容修復) ==========
    function startReciting(taskId) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return;

      const btn = document.querySelector(`#card-${taskId} .recite-btn`);
      const feedback = document.getElementById(`feedback-${taskId}`);

      accumulatedText = "";
      btn.dataset.status = 'recording';
      btn.style.backgroundColor = '#4CAF50';
      btn.innerText = '✅ 我背完了（點我送出）';

      feedback.style.display = 'block';
      feedback.style.color = '#718096';
      feedback.textContent = '小老師聽著喔，你可以慢慢想、慢慢背...';

      activeRec = new SpeechRecognition();
      activeRec.lang = 'zh-TW';
      
      // iOS 避開 continuous 導致的死機，Android/PC 正常使用
      activeRec.continuous = !isIOS;
      activeRec.interimResults = !isIOS; 

      activeRec.onresult = (event) => {
        if (btn.dataset.status !== 'recording') return;

        let currentString = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          if (event.results[i].isFinal || (!isIOS && event.results[i].isFinal === false)) {
            currentString += event.results[i][0].transcript;
          }
        }
        
        // 如果是 iOS，每次收到的是最終片段，直接累加
        if (isIOS && currentString) {
          accumulatedText += currentString + "，";
        } else if (!isIOS) {
          accumulatedText = currentString;
        }

        if (accumulatedText.trim()) {
          feedback.textContent = '小老師聽到了：' + accumulatedText;
        }

        clearTimeout(silenceTimer);
        silenceTimer = setTimeout(() => {
          if (btn.dataset.status === 'recording') {
            finishAndSubmitRecitation(taskId);
          }
        }, 60000); 
      };

      activeRec.onend = () => {
        // 【iOS 關鍵修復】：如果 iOS 自動切斷麥克風，但學生還沒按「送出」，就偷偷幫他重新啟動
        if (isIOS && btn.dataset.status === 'recording') {
          try { activeRec.start(); } catch(e) {}
        }
      };

      activeRec.onerror = (event) => {
        if (event.error === 'no-speech' && isIOS && btn.dataset.status === 'recording') {
           // iOS 常常報 no-speech，忽略它並交給 onend 自動重啟
           return;
        }
        if (event.error !== 'no-speech') {
          console.error('語音辨識問題：', event.error);
        }
      };

      try {
        activeRec.start();
      } catch (e) {
        console.error(e);
      }
    }

    // ========== 送出給 OpenAI 評估 ==========
    function finishAndSubmitRecitation(taskId) {
      const btn = document.querySelector(`#card-${taskId} .recite-btn`);
      const feedback = document.getElementById(`feedback-${taskId}`);

      clearTimeout(silenceTimer);
      btn.dataset.status = 'submitting';

      if (activeRec) {
        try { activeRec.stop(); } catch(e) {}
      }

      const finalSpeech = accumulatedText.replace(/，$/, '').trim();

      if (!finalSpeech) {
        btn.dataset.status = 'idle';
        btn.style.backgroundColor = '#E07A5F';
        btn.innerText = '🎙️ 按我開始背誦';
        feedback.style.color = '#E07A5F';
        feedback.textContent = '還沒有聽到聲音喔，再試一次！';
        return;
      }

      btn.style.backgroundColor = '#E07A5F';
      btn.innerText = '⏳ 小老師思考中...';

      fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'verifyRecitation',
          classCode: currentClassCode,
          seatNo: currentSeatNo,
          taskId: taskId,
          speechText: finalSpeech
        })
      })
      .then(res => res.json())
      .then(res => {
        btn.dataset.status = 'idle';
        btn.innerText = '🎙️ 按我重新背誦';
        feedback.style.display = 'block';

        if (res.status === 'success' && res.data) {
          feedback.textContent = res.data.feedback;

          if (res.data.passed) {
            feedback.style.color = '#2E7D32';
            setTimeout(() => fetchPendingTasks(currentClassCode, currentSeatNo), 2500);
          } else {
            feedback.style.color = '#E07A5F';
          }
        } else {
          feedback.style.color = '#E07A5F';
          feedback.textContent = '評估失敗：' + (res.message || '後端未回應');
        }
      })
      .catch(err => {
        btn.dataset.status = 'idle';
        btn.innerText = '🎙️ 按我重新背誦';
        feedback.style.display = 'block';
        feedback.style.color = '#E07A5F';
        feedback.textContent = '連線失敗：' + err.toString();
      });
    }
  </script>
</body>
</html>
